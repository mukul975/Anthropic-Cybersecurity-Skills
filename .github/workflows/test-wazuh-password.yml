name: Test Wazuh password input

on:
  push:
    paths:
      - 'skills/implementing-endpoint-detection-with-wazuh/scripts/**'
      - '.github/workflows/test-wazuh-password.yml'
  pull_request:
    paths:
      - 'skills/implementing-endpoint-detection-with-wazuh/scripts/**'
      - '.github/workflows/test-wazuh-password.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/implementing-endpoint-detection-with-wazuh/scripts -p test_password_input.py -v
