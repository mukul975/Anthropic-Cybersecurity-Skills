name: Test Wazuh logtest response parsing

on:
  push:
    paths:
      - 'skills/implementing-endpoint-detection-with-wazuh/scripts/**'
      - '.github/workflows/test-wazuh-logtest.yml'
  pull_request:
    paths:
      - 'skills/implementing-endpoint-detection-with-wazuh/scripts/**'
      - '.github/workflows/test-wazuh-logtest.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/implementing-endpoint-detection-with-wazuh/scripts -p test_agent.py -v
